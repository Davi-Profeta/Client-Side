<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sytle.css">
    <title>Document</title>

</head>

<body>
    
    <form action="">

        <div class="forms">

            <h1>Pesquisa de Satisfação</h1>

        <main>
            
            <section>
                <label for="nome">Nome</label>
                <input type="text" value="nome">
                
                <label for="idade">Idade</label>
                <input type="number" value="idade">
            </section>

            <label for="">Nota de 0 a 10</label>
            <input type="number" value="">

            <section>
                <label for="">Qualidade:</label>
                <input type="radio" name="qualidade" value="">Exelente
                <input type="radio" name="qualidade" value="">Bom
                <input type="radio" name="qualidade" value="">Regular
                <input type="radio" name="qualidade" value="">Ruim
            </section>

            <section>
                <label for="">O que melhorar?</label>
                <input type="checkbox" value="">Atendente
                <input type="checkbox" value="">Qualidade
                <input type="checkbox" value="">Preço
                <input type="checkbox" value="">Ambiente
                <input type="checkbox" value="">Outros
            </section>

            <div class="botoes">
                <button class="b">Enviar pesquisa</button>
                <button class="b" type="reset">Limpar</button>
            </div>
            
        </main>

        </div>
        

    </form>

</body>

</html>

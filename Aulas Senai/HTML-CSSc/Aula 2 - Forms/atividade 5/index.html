<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <style>
        
    </style>
</head>
<body>

    <h1>Cadastro de Vaga de Emprego</h1>

    <form action="">

        <h2>Dados Pessoais</h2>
        <section>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required maxlength="14">
            </div>
            <div class="campo">
                <label for="rg">RG</label>
                <input type="text" id="rg" name="rg" required maxlength="10">
            </div>
            <div class="campo">
                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>
            <div class="campo">
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>
        </section>

        <h2>Contato</h2>
        <section>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>
            <div class="campo">
                <label for="celular">Celular</label>
                <input type="tel" id="celular" name="celular" required>
            </div>
        </section>

        <h2>Endereço</h2>
        <section>
            <div class="campo">
                <label for="rua">Rua</label>
                <input type="text" id="rua" name="rua" required>
            </div>
            <div class="campo">
                <label for="numero">Número</label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div class="campo">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" name="bairro" required>
            </div>
            <div class="campo">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>
            </div>
            <div class="campo">
                <label for="estado">Estado</label>
                <input type="text" id="estado" name="estado" required>
            </div>
        </section>

        <h2>Informações Profissionais</h2>
        <section>
            <div class="campo">
                <label for="escolaridade">Escolaridade</label>
                <select id="escolaridade" name="escolaridade" required>
                    <option value="" disabled selected>Selecione</option>
                    <option value="fundamental">Ensino Fundamental</option>
                    <option value="medio">Ensino Médio</option>
                    <option value="tecnico">Técnico</option>
                    <option value="superior">Ensino Superior</option>
                    <option value="pos">Pós-graduação</option>
                </select>
            </div>
            <div class="campo">
                <label for="cursos">Cursos</label>
                <textarea id="cursos" name="cursos" rows="3" required></textarea>
            </div>
            <div class="campo">
                <label for="experiencia">Experiência profissional</label>
                <textarea id="experiencia" name="experiencia" rows="4" required></textarea>
            </div>
            <div class="campo">
                <label for="salario">Pretensão salarial (R$)</label>
                <input type="number" id="salario" name="salario" min="0" required>
            </div>
        </section>

        <h2>Tecnologias</h2>
        <section>
            <div class="checkbox-grupo">
                <div>
                    <input type="checkbox" id="html" name="tecnologias" value="html">
                    <label for="html">HTML</label>
                </div>
                <div>
                    <input type="checkbox" id="css" name="tecnologias" value="css">
                    <label for="css">CSS</label>
                </div>
                <div>
                    <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
                    <label for="javascript">JavaScript</label>
                </div>
                <div>
                    <input type="checkbox" id="java" name="tecnologias" value="java">
                    <label for="java">Java</label>
                </div>
                <div>
                    <input type="checkbox" id="python" name="tecnologias" value="python">
                    <label for="python">Python</label>
                </div>
                <div>
                    <input type="checkbox" id="banco" name="tecnologias" value="banco">
                    <label for="banco">Banco de Dados</label>
                </div>
            </div>
        </section>

        <h2>Envio</h2>
        <section>
            <div class="campo">
                <label for="curriculo">Upload de currículo</label>
                <input type="file" id="curriculo" name="curriculo" accept=".pdf,.doc,.docx" required>
            </div>
        </section>

        <button type="submit">Cadastrar</button>

    </form>

</body>
</html>

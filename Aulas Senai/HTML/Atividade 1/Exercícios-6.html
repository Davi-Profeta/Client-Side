<!-- Ex 6
 Exercício 6 — Mesclando colunas (colspan)
Crie uma tabela de horários:
• Segunda a Sexta
• Manhã e Tarde
Em uma linha, use colspan para representar:
• "Intervalo" ocupando 2 colunas-->

<table border="2">
    <tr>
        <th>Segunda</th>
        <th>Terça</th>
        <th>Quarta</th>
        <th>Quinta</th>
        <th>Sexta</th>
    </tr>

    <tr>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
    </tr>

    <tr>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
        <td>Manhã</td>
    </tr>

    <!-- Intervalo -->
    <tr>
        <td colspan="2">INTERVALO</td>
        <td colspan="4">A DEPENDER</td>
    </tr>

    <tr>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
    </tr>

    <tr>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
        <td>Tarde</td>
    </tr>
</table>

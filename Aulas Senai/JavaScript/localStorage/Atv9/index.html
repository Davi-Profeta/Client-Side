<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Atividade 10 - Remover Tudo</title>
<style>
  body {
    background-color: #121212;
    color: #f0f0f0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  h1 {
    color: #4dd0e1;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    background-color: #e57373;
    color: #121212;
    font-weight: bold;
    cursor: pointer;
  }

  button:hover {
    background-color: #ef5350;
  }

  #mensagem {
    margin-top: 15px;
    color: #81c784;
    font-weight: bold;
    min-height: 20px;
  }
</style>
</head>
<body>

  <h1>Remover Tudo</h1>

  <button id="btnLimpar">Limpar Dados</button>
  <p id="mensagem"></p>

  <script>
    const btnLimpar = document.getElementById("btnLimpar");
    const mensagem = document.getElementById("mensagem");

    function limparDados() {
      localStorage.clear();
      mensagem.textContent = "Dados apagados.";
    }

    btnLimpar.addEventListener("click", limparDados);
  </script>

</body>
</html>

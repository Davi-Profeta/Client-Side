<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 17 – Números Pares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .botoes {
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        #btnGerar {
            background-color: #28a745;
            color: white;
        }
        #btnDesativar {
            background-color: #dc3545;
            color: white;
        }
        button:disabled {
            background-color: #cccccc !important;
            cursor: not-allowed;
        }
        .painel {
            text-align: center;
            font-size: 20px;
            min-height: 80px;
        }
        #numeroSorteado {
            font-size: 32px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .sucesso { color: #28a745; }
        .falha { color: #dc3545; }
        .info { color: #6c757d; font-size: 16px; }
    </style>
</head>
<body>

    <h1>Filtro de Números Pares</h1>
    
    <div class="botoes">
        <button id="btnGerar">Gerar Número</button>
        <button id="btnDesativar">Desativar Botão</button>
    </div>

    <div class="painel">
        <div id="numeroSorteado">-</div>
        <div id="mensagem">Clique em "Gerar Número" para começar.</div>
    </div>

</body>
    <script src="script.js "></script>
</html>

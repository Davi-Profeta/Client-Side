<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Cadastro com Limite</h1>

    <div class="btns">
        <button id="btn1">Ativar Cadrasto</button>
        <br>
        <button id="btn2">Desativar Cadrasto</button>
    </div>

    <p id="ativo">Cadastro desativado!</p>
    
    <div class="nome">
        <label for="name">Nome</label>
        <input id="name" type="text" placeholder="Digite um nome">
        <input id="submit" type="submit">
    </div>

    <div class="list">
        <h2>Nomes Cadastrados</h2>

        <div class="listname">
            <p id="para">Esses são todos os nomes que você colocou, lembre do limite de 5 nomes:</p>
            <ul id="ul">
                
            </ul>
        </div>
    </div>
    
    
</body>
    <script src="script.js"></script>
</html>

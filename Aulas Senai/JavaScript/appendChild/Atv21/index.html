<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Atividade 21 - Sistema de Senhas de Atendimento</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 30px;
      color: #ffffff;
      text-align: center;
    }

    .botoes {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btnGerar {
      background-color: #4caf50;
      color: white;
    }

    #btnAtender {
      background-color: #1e88e5;
      color: white;
    }

    .painel {
      width: 100%;
      max-width: 400px;
      background-color: #2a2a40;
      border-radius: 10px;
      padding: 20px;
    }

    .painel h2 {
      font-size: 16px;
      color: #aaaaaa;
      margin-bottom: 12px;
      text-align: center;
    }

    #listaSenhas {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 50px;
    }

    .senha {
      background-color: #3949ab;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      animation: aparecer 0.2s ease;
    }

    .senha:first-child {
      background-color: #fb8c00;
      color: #1e1e2f;
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    #status {
      margin-top: 20px;
      color: #aaaaaa;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Sistema de Senhas de Atendimento</h1>

  <div class="botoes">
    <button id="btnGerar">Gerar Senha</button>
    <button id="btnAtender">Atender Cliente</button>
  </div>

  <div class="painel">
    <h2>Fila de senhas (a próxima a ser chamada fica em destaque)</h2>
    <ul id="listaSenhas"></ul>
  </div>

  <p id="status">Senhas na fila: 0</p>

  <script>
    let contadorSenhas = 0;

    const listaSenhas = document.getElementById("listaSenhas");
    const btnGerar = document.getElementById("btnGerar");
    const btnAtender = document.getElementById("btnAtender");
    const status = document.getElementById("status");

    function atualizarStatus() {
      status.innerText = "Senhas na fila: " + listaSenhas.children.length;
      btnAtender.disabled = listaSenhas.children.length === 0;
    }

    function gerarSenha() {
      contadorSenhas++;

      const itemSenha = document.createElement("li");
      itemSenha.classList.add("senha");
      itemSenha.innerText = "Senha " + contadorSenhas;

      listaSenhas.appendChild(itemSenha);

      atualizarStatus();
    }

    function atenderCliente() {
      const primeiraSenha = listaSenhas.firstElementChild;

      if (primeiraSenha === null) {
        return;
      }

      listaSenhas.removeChild(primeiraSenha);
      atualizarStatus();
    }

    btnGerar.addEventListener("click", gerarSenha);
    btnAtender.addEventListener("click", atenderCliente);

    atualizarStatus();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cliques</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            text-align: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background-color: #f4f4f4;
            margin: 5px auto;
            padding: 10px;
            width: 50%;
            border-radius: 4px;
            border-left: 5px solid #28a745;
        }
    </style>
</head>
<body>

    <button id="botaoClique">Clique Aqui</button>

    <ul id="listaDeCliques"></ul>

        // Seleciona os elementos no HTML
      
    </script>

</body>
</html>
